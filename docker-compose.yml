services:
  autoprint:
    build:
      context: .
    container_name: autoprint
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      CUPS_SERVER: /run/cups/cups.sock
      APP_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - autoprint-data:/data
      - cups-config:/etc/cups
      - cups-spool:/var/spool/cups
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  autoprint-data:
  cups-config:
  cups-spool:
